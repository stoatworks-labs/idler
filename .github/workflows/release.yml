name: release

# Build both Idler plugins for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) Idler.bundle + "Idler Mask.bundle"
#   - Windows -> x64 Idler.dll + "Idler Mask.dll" (GLEW static via vcpkg)
#
# Two artefacts per platform and not one, because FFGL resolves a single plugMain
# per binary: a source and an effect are two bundles, not one bundle with two
# entries. Both go in the same zip -- an operator wants the pair.
#
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-14 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # --- macOS: no extra deps, universal build straight from CMake ---
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DIDLER_BUILD_TOOLS=OFF

      # --- Windows: GLEW comes from vcpkg, static-linked (static-md keeps the
      #     CRT dynamic so the plugin matches the host) so the .dll has no
      #     external glew32.dll runtime dependency. ---
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DIDLER_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            for bundle in "Idler" "Idler Mask"; do
              cp -R "build/$bundle.bundle" "out/$bundle.bundle"
              # The registration lives in a file-scope constructor nothing names,
              # so a linker that dropped the translation unit would still produce
              # a loadable bundle that reports it contains no plugins. Check the
              # export, and check the build really is universal -- CMake latches
              # the architecture list at the first target and silently ignores a
              # late change while still reporting success.
              #
              # Captured and matched with `case`, never `... | grep -q`. Actions
              # runs `shell: bash` as `bash -eo pipefail`, and a `grep -q` that
              # finds its match exits immediately -- the writer upstream takes
              # SIGPIPE and the PIPELINE fails, so a correct binary fails the
              # release. Size-dependent, so it bites the bigger binary first.
              archs=$( lipo -archs "out/$bundle.bundle/Contents/MacOS/$bundle" )
              echo "  $bundle: $archs"
              case "$archs" in *arm64*)  ;; *) echo "no arm64 in $bundle"; exit 1 ;; esac
              case "$archs" in *x86_64*) ;; *) echo "no x86_64 in $bundle"; exit 1 ;; esac
              symbols=$( nm -gU "out/$bundle.bundle/Contents/MacOS/$bundle" )
              case "$symbols" in *_plugMain*) ;; *) echo "$bundle exports no plugMain"; exit 1 ;; esac
            done
          else
            cp "build/Release/Idler.dll" "out/Idler.dll"
            cp "build/Release/Idler Mask.dll" "out/Idler Mask.dll"
          fi
          ls -R out

          # The OpenFX build ships as its own zip rather than being folded into
          # the FFGL artefact: it installs to /Library/OFX/Plugins, not to
          # Resolume's Extra Effects, and an operator who wants one rarely wants
          # the other in the same place.
          mkdir -p ofxout
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/Idler.ofx.bundle" "ofxout/Idler.ofx.bundle"
            ofxbin="ofxout/Idler.ofx.bundle/Contents/MacOS/Idler.ofx"
            archs=$( lipo -archs "$ofxbin" )
            echo "  Idler.ofx: $archs"
            case "$archs" in *arm64*)  ;; *) echo "no arm64 in Idler.ofx"; exit 1 ;; esac
            case "$archs" in *x86_64*) ;; *) echo "no x86_64 in Idler.ofx"; exit 1 ;; esac
            symbols=$( nm -gU "$ofxbin" )
            case "$symbols" in *_OfxGetPlugin*) ;; *) echo "no OfxGetPlugin"; exit 1 ;; esac
            case "$symbols" in *_OfxGetNumberOfPlugins*) ;; *) echo "no OfxGetNumberOfPlugins"; exit 1 ;; esac
            # CFBundleExecutable against the binary on disk. A mismatch builds,
            # loads and renders perfectly and then fails codesign with a message
            # that never mentions the plist -- it has cost this fleet a tag.
            exe=$( /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" \
                     "ofxout/Idler.ofx.bundle/Contents/Info.plist" )
            [ "$exe" = "Idler.ofx" ] || { echo "CFBundleExecutable is '$exe'"; exit 1; }
            codesign --force --deep --sign - --timestamp=none "ofxout/Idler.ofx.bundle"
          else
            mkdir -p "ofxout/Idler.ofx.bundle/Contents/Win64"
            cp "build/Idler.ofx.bundle/Contents/Win64/Idler.ofx" \
               "ofxout/Idler.ofx.bundle/Contents/Win64/Idler.ofx"
          fi
          ls -R ofxout

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../idler-${{ matrix.name }}.zip" ./*
          else
            zip -r "../idler-${{ matrix.name }}.zip" ./*
          fi
          cd ../ofxout
          if command -v 7z >/dev/null 2>&1; then
            7z a "../idler-ofx-${{ matrix.name }}.zip" ./*
          else
            zip -r "../idler-ofx-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific -- the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects -- so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users. Mounting an image and dragging the bundles where the
        # README says is the honest shape here.
        run: |
          source scripts/release-lib.sh
          rl_init "Idler" idler "${{ steps.ver.outputs.version }}" \
            com.stoatworks.idler "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/Idler.bundle"
          rl_adhoc_sign "out/Idler Mask.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idler-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded. Its directory page defaults to the common FFGL folder
    # but stays editable, because Resolume reads plugins from a path the user
    # chooses per edition.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Idler" idler "$version" com.stoatworks.idler "$PWD/installers"
          zip="$(find artifacts -name "idler-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --cli: a plugin has no executable to make a shortcut to.
          rl_nsis windows-x86_64 "$stage" --cli
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: idler-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
